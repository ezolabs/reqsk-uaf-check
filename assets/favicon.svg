<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ezo labs">
  <!-- The striped-sphere mark cut to 5 thick bars on the 16px pixel grid
       (4-unit bars, 2-unit gaps = 2px/1px at 16) so it stays crisp in a tab. -->
  <rect width="32" height="32" rx="7" fill="#3b6ef6"/>
  <g fill="#05070f">
    <rect x="10" y="2" width="12" height="4" rx="2"/>
    <rect x="4" y="8" width="24" height="4" rx="2"/>
    <rect x="2" y="14" width="28" height="4" rx="2"/>
    <rect x="4" y="20" width="24" height="4" rx="2"/>
    <rect x="10" y="26" width="12" height="4" rx="2"/>
  </g>
</svg>
